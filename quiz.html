<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .back-btn { background: white; color: #667eea; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 1rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .sound-btn { background: white; border: none; padding: 15px; border-radius: 50%; cursor: pointer; font-size: 1.5rem; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 2.5rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
        .score-bar { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-around; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .score-item { text-align: center; }
        .score-label { font-size: 0.9rem; color: #666; margin-bottom: 5px; }
        .score-value { font-size: 1.8rem; font-weight: bold; color: #667eea; }
        .timer { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 15px; border-radius: 15px; text-align: center; font-size: 1.5rem; font-weight: bold; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .progress-bar { background: white; height: 15px; border-radius: 10px; margin-bottom: 20px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .progress-fill { background: linear-gradient(90deg, #43e97b 0%, #38f9d7 100%); height: 100%; transition: width 0.3s; }
        .quiz-card { background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .question-num { color: #667eea; font-size: 1.2rem; margin-bottom: 20px; font-weight: bold; text-align: center; }
        .question { font-size: 2.2rem; color: #333; margin-bottom: 35px; text-align: center; font-weight: bold; line-height: 1.4; }
        .options { display: grid; gap: 15px; margin-bottom: 20px; }
        .option { background: #f8f9fa; padding: 20px; border-radius: 15px; cursor: pointer; font-size: 1.3rem; transition: all 0.3s; border: 3px solid transparent; text-align: center; font-weight: 500; }
        .option:hover { background: #e9ecef; transform: translateX(8px); border-color: #667eea; }
        .correct { background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%) !important; color: white; border-color: #2e7d32 !important; }
        .wrong { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%) !important; color: white; border-color: #c62828 !important; }
        .hint-btn { background: #ff9800; color: white; padding: 12px 25px; border: none; border-radius: 10px; cursor: pointer; font-size: 1rem; font-weight: bold; margin-right: 10px; }
        .hint { background: #fff3cd; padding: 20px; border-radius: 15px; margin-top: 20px; color: #856404; font-size: 1.1rem; display: none; border-left: 5px solid #ffc107; }
        .next-btn { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px 40px; border: none; border-radius: 10px; font-size: 1.2rem; cursor: pointer; font-weight: bold; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .result-card { text-align: center; }
        .result-icon { font-size: 5rem; margin-bottom: 20px; }
        .result-title { font-size: 2.5rem; color: #667eea; margin-bottom: 20px; font-weight: bold; }
        .result-score { font-size: 3rem; color: #333; margin: 20px 0; font-weight: bold; }
        .result-msg { font-size: 1.5rem; color: #666; margin: 20px 0; }
        .result-btns { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px; }
        .result-btn { padding: 15px 35px; border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        .shake { animation: shake 0.5s; }
        .bounce { animation: bounce 0.5s; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <button class="back-btn" onclick="window.location.href='index.html'">← Back</button>
            <button class="sound-btn" id="soundBtn" onclick="toggleSound()">🔊</button>
        </div>
        
        <h1 id="quizTitle">🎯 Quiz</h1>
        
        <div class="score-bar">
            <div class="score-item">
                <div class="score-label">Score</div>
                <div class="score-value"><span id="score">0</span>/<span id="total">10</span></div>
            </div>
            <div class="score-item">
                <div class="score-label">🔥 Streak</div>
                <div class="score-value" id="streak">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">⭐ Bonus</div>
                <div class="score-value" id="bonus">0</div>
            </div>
        </div>
        
        <div class="timer">⏱️ Time: <span id="timer">15</span>s</div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        
        <div class="quiz-card">
            <div class="question-num" id="questionNum"></div>
            <div class="question" id="question"></div>
            <div class="options" id="options"></div>
            <div>
                <button class="hint-btn" id="hintBtn" onclick="showHint()">💡 Show Hint</button>
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next Question →</button>
            </div>
            <div class="hint" id="hint"></div>
        </div>
    </div>
    
    <script src="quiz-data.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const quizId = parseInt(urlParams.get('id')) || 1;
        const quizData = allQuizData[quizId] || allQuizData[1];
        
        let currentQ = 0, score = 0, answered = false, timer, timeLeft = 15, streak = 0, bonus = 0, soundOn = true;
        
        document.getElementById('quizTitle').textContent = `🎯 Quiz ${quizId}`;
        
        function loadQuestion() {
            answered = false;
            timeLeft = 15;
            const data = quizData[currentQ];
            document.getElementById('questionNum').textContent = `Question ${currentQ + 1} of ${quizData.length}`;
            document.getElementById('question').textContent = data.q;
            document.getElementById('score').textContent = score;
            document.getElementById('bonus').textContent = bonus;
            document.getElementById('streak').textContent = streak;
            document.getElementById('hint').style.display = 'none';
            document.getElementById('hintBtn').style.display = 'inline-block';
            document.getElementById('nextBtn').style.display = 'none';
            
            const progress = (currentQ / quizData.length) * 100;
            document.getElementById('progress').style.width = progress + '%';
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            [...data.opts].sort(() => Math.random() - 0.5).forEach(opt => {
                const div = document.createElement('div');
                div.className = 'option';
                div.textContent = opt;
                div.onclick = () => checkAnswer(opt, div);
                optionsDiv.appendChild(div);
            });
            
            startTimer();
        }
        
        function startTimer() {
            clearInterval(timer);
            document.getElementById('timer').textContent = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    if (!answered) autoNext();
                }
            }, 1000);
        }
        
        function autoNext() {
            answered = true;
            streak = 0;
            document.getElementById('streak').textContent = streak;
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
        
        function showHint() {
            const hint = document.getElementById('hint');
            hint.textContent = '💡 ' + quizData[currentQ].hint;
            hint.style.display = 'block';
            document.getElementById('hintBtn').style.display = 'none';
        }
        
        function checkAnswer(selected, element) {
            if (answered) return;
            answered = true;
            clearInterval(timer);
            
            const correct = quizData[currentQ].ans;
            const options = document.querySelectorAll('.option');
            
            if (selected === correct) {
                element.classList.add('correct', 'bounce');
                score++;
                streak++;
                if (timeLeft > 10) bonus += 2;
                else if (timeLeft > 5) bonus += 1;
                playSound('correct');
                document.getElementById('score').textContent = score;
                document.getElementById('bonus').textContent = bonus;
                document.getElementById('streak').textContent = streak;
            } else {
                element.classList.add('wrong', 'shake');
                streak = 0;
                playSound('wrong');
                document.getElementById('streak').textContent = streak;
                options.forEach(opt => {
                    if (opt.textContent === correct) opt.classList.add('correct');
                });
            }
            
            document.getElementById('nextBtn').style.display = 'inline-block';
        }
        
        function nextQuestion() {
            currentQ++;
            if (currentQ < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }
        
        function showResults() {
            clearInterval(timer);
            const totalScore = score + bonus;
            const percent = Math.round((score / quizData.length) * 100);
            
            // Save to localStorage
            const stats = JSON.parse(localStorage.getItem('quizStats') || '{}');
            if (!stats[quizId] || stats[quizId].total < totalScore) {
                stats[quizId] = { score, bonus, total: totalScore };
                localStorage.setItem('quizStats', JSON.stringify(stats));
            }
            
            let icon = '🎉', msg = 'Keep Practicing!';
            if (score >= 9) { icon = '🏆'; msg = 'Outstanding Performance!'; }
            else if (score >= 7) { icon = '⭐'; msg = 'Excellent Work!'; }
            else if (score >= 5) { icon = '👍'; msg = 'Good Job!'; }
            
            document.querySelector('.timer').style.display = 'none';
            document.querySelector('.progress-bar').style.display = 'none';
            document.querySelector('.quiz-card').innerHTML = `
                <div class="result-card">
                    <div class="result-icon">${icon}</div>
                    <div class="result-title">Quiz Complete!</div>
                    <div class="result-score">${score} / ${quizData.length}</div>
                    <div style="font-size: 1.3rem; color: #ff9800; margin: 10px 0;">⭐ Bonus: ${bonus} points</div>
                    <div style="font-size: 2rem; color: #667eea; font-weight: bold; margin: 10px 0;">Total: ${totalScore} points</div>
                    <div style="font-size: 1.5rem; color: #667eea; font-weight: bold;">${percent}%</div>
                    <div class="result-msg">${msg}</div>
                    <div class="result-btns">
                        <button class="result-btn" style="background: #667eea; color: white;" onclick="location.reload()">🔄 Retry</button>
                        <button class="result-btn" style="background: #4caf50; color: white;" onclick="nextQuiz()">➡️ Next Quiz</button>
                        <button class="result-btn" style="background: #764ba2; color: white;" onclick="window.location.href='index.html'">🏠 Home</button>
                    </div>
                </div>
            `;
        }
        
        function playSound(type) {
            if (!soundOn) return;
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            
            if (type === 'correct') {
                osc.frequency.value = 800;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.3);
            } else {
                osc.frequency.value = 200;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.2);
            }
        }
        
        function toggleSound() {
            soundOn = !soundOn;
            document.getElementById('soundBtn').textContent = soundOn ? '🔊' : '🔇';
        }
        
        function nextQuiz() {
            const nextId = (quizId % 50) + 1;
            window.location.href = `quiz.html?id=${nextId}`;
        }
        
        loadQuestion();
    </script>
</body>
</html>
